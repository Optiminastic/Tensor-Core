# The whole backend, locally: the API and BOTH workers, in one command.
#
#   docker compose up -d --build        # API + production worker + slice worker
#   docker compose up -d productionworker sliceworker   # workers only (API via `go run`)
#   docker compose logs -f              # what they are doing
#
# This mirrors what runs on the server, where the same three images are three
# Coolify services (tensor-api, tensor-production-worker, tensor-slice-worker).
# Running only the API locally is the state this file exists to end: without the
# workers nothing renders a model, nothing plans a bed, nothing slices a plate
# and nothing pins a sent plate to the printer an operator chose - the queue
# simply fills up and no error ever says why.
#
# Configuration is env/local.env, the same file each binary loads on the host.
# It is gitignored and excluded by .dockerignore, so it is mounted at run time
# and never baked into an image. Only the values that CANNOT be right on both
# sides are overridden per service below.
#
# The database runs HERE, in the postgres service below. It used to be a hosted
# Neon branch, which worked until the free tier's compute quota ran out and
# every connection - the API's, the workers', psql's - was refused at once with
# SQLSTATE 53000. A development database that can stop answering because a
# meter somewhere ran down is a development database that will do it again, on
# a day when somebody is trying to ship.
#
# Object storage (AWS) and BambuBuddy are still reachable from inside these
# containers as they are from the host - BambuBuddy included, over its tailnet
# name, because Docker Desktop routes container traffic through the host's
# network stack and so through Tailscale.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tensor-postgres-local
    environment:
      POSTGRES_USER: tensor
      POSTGRES_PASSWORD: tensor
      POSTGRES_DB: tensor
    # Published, because the host runs things against it too: `go run ./cmd/api`,
    # goose, psql, and the frontend's own Better Auth pool. Containers reach it
    # as postgres:5432; the host as localhost:5433.
    #
    # 5433, not 5432: a developer with Postgres already installed has 5432
    # taken, and the failure - "port is already allocated", or worse, silently
    # talking to the wrong database - is not worth the tidier number.
    ports: ['5433:5432']
    volumes:
      # A NAMED VOLUME, so the data survives `docker compose down`. A bind
      # mount onto a Windows filesystem is the other option and it is slower
      # and breaks on file permissions.
      - tensor-pgdata:/var/lib/postgresql/data
    # The API refuses to start if its schema did not apply, so it must not be
    # started before Postgres is actually accepting connections - "the
    # container is running" is not the same thing.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tensor -d tensor']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tensor-api
    env_file: [env/local.env]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8001:8001"]
    environment:
      # env/local.env points at localhost:5433, which is the HOST's address
      # for the postgres service. In here that is this container's own
      # loopback and there is nothing on it, so the same database has to be
      # named by its service. Same story as OPENSCAD_BIN below.
      DATABASE_URL: postgres://tensor:tensor@postgres:5432/tensor?sslmode=disable
      # OFF, pinned here rather than left to env/local.env. The API runs the
      # whole pipeline itself when RUN_PRODUCTION_WORKERS is not false, so it
      # can mint a customer's link and send it exactly as the worker can. See
      # the note on the worker below.
      PERSONALISATION_CHECK_ENABLED: "false"
    restart: unless-stopped

  productionworker:
    build:
      context: .
      dockerfile: productionworker.Dockerfile
    image: tensor-production-worker
    env_file: [env/local.env]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # env/local.env points at localhost:5433, which is the HOST's address
      # for the postgres service. In here that is this container's own
      # loopback and there is nothing on it, so the same database has to be
      # named by its service. Same story as OPENSCAD_BIN below.
      DATABASE_URL: postgres://tensor:tensor@postgres:5432/tensor?sslmode=disable
      # env/local.env points at the Windows OpenSCAD for host runs. In here it
      # is the extracted AppImage, and getting this wrong is quiet: the worker
      # reports model generation disabled at startup and every personalised job
      # waits for a manual upload rather than failing.
      #
      # /usr/local/bin, not /usr/bin: this is no longer the distro package.
      OPENSCAD_BIN: /usr/local/bin/openscad
      # Same story: a Windows path on the host, the baked-in copy in here.
      OPENSCAD_ASSET_DIR: /opt/tensor/scadassets
      # THE PERSONALISATION CHECK IS OFF, and pinned here for the same reason
      # the win-back worker's two switches are: it is consent, not
      # configuration, and this is the service that would act on it. Turning
      # it on mints a public link per order and sends it to the number on the
      # order - a real customer's phone, not a test one, unless
      # PERSONALISATION_TEST_RECIPIENT is also set.
      #
      # Off, every rule still runs and the log says whose order it WOULD have
      # asked about, which is how the rules get checked against a real store
      # before a stranger's phone buzzes. Nothing is minted, nothing is sent
      # and no job is held.
      #
      # Before turning it on: set PERSONALISATION_TEST_RECIPIENT so every
      # message is redirected to one phone, narrow PERSONALISATION_ONLY to a
      # single order number, and set FRONTEND_URL - without that last one the
      # sender logs "no public address is configured" and sends nothing at
      # all, silently.
      PERSONALISATION_CHECK_ENABLED: "false"
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "4", memory: 2G}

  # The customer's half of the pipeline: the link, the preview and the window
  # sweep. Same image as productionworker - it renders, so it needs the same
  # OpenSCAD - with a different command.
  #
  # Running this alongside productionworker changes nothing by itself: River
  # locks each job to one worker, and productionworker keeps consuming these
  # queues until RUN_PERSONALISATION_WORKERS=false is set on it. Flip that
  # only once this service is up. The other order stops links being sent AND
  # stops them expiring, which holds every personalised order invisibly.
  personalisationworker:
    build:
      context: .
      dockerfile: productionworker.Dockerfile
    image: tensor-production-worker
    command: ["personalisationworker"]
    env_file: [env/local.env]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://tensor:tensor@postgres:5432/tensor?sslmode=disable
      OPENSCAD_BIN: /usr/local/bin/openscad
      OPENSCAD_ASSET_DIR: /opt/tensor/scadassets
      # Consent, not configuration - the same reasoning as productionworker's
      # copy of this. Turning it on mints a public link per order and sends it
      # to the number on the order, which is a real customer's phone unless
      # PERSONALISATION_TEST_RECIPIENT is also set.
      PERSONALISATION_CHECK_ENABLED: "false"
    restart: unless-stopped
    deploy:
      resources:
        # Lighter than productionworker: two preview renders at a time rather
        # than the floor's whole render pool.
        limits: {cpus: "2", memory: 1G}

  sliceworker:
    build:
      context: .
      dockerfile: sliceworker.Dockerfile
    image: tensor-slice-worker
    env_file: [env/local.env]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # env/local.env points at localhost:5433, which is the HOST's address
      # for the postgres service. In here that is this container's own
      # loopback and there is nothing on it, so the same database has to be
      # named by its service. Same story as OPENSCAD_BIN below.
      DATABASE_URL: postgres://tensor:tensor@postgres:5432/tensor?sslmode=disable
      # The whole point of running this in a container. env/local.env sets
      # FAKE_SLICE=true because a Windows host cannot run Bambu Studio; here it
      # can, so fabricated metrics would waste a working slicer.
      FAKE_SLICE: "false"
      BAMBU_ROOT: /opt/bambu/squashfs-root
    restart: unless-stopped
    # Slicing is CPU-bound and SLICE_CONCURRENCY runs that many at once.
    # Uncapped, one burst of batches starves everything else on the box.
    deploy:
      resources:
        limits: {cpus: "4", memory: 4G}

  # The abandoned-checkout call scheduler. Separate from the pipeline on
  # purpose: this is the only process that telephones a member of the public,
  # so stopping it must stop the calling and nothing else.
  #
  # WINBACK_CALLS_ENABLED is false here. The sweep still runs every rule and
  # logs who it WOULD ring; switching calls on is a deliberate act, never a
  # side effect of a restart.
  winbackworker:
    build:
      context: .
      dockerfile: winbackworker.Dockerfile
    image: tensor-winback-worker
    env_file: [env/local.env]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # env/local.env points at localhost:5433, which is the HOST's address
      # for the postgres service. In here that is this container's own
      # loopback and there is nothing on it, so the same database has to be
      # named by its service. Same story as OPENSCAD_BIN below.
      DATABASE_URL: postgres://tensor:tensor@postgres:5432/tensor?sslmode=disable
      # BOTH channels off. Each is consent, not configuration, and they
      # are separate because a call interrupts somebody and a message
      # waits for them - a shop that wants one must not get the other
      # because they shared a flag. The sweep still runs every rule and
      # logs who it WOULD have reached.
      WINBACK_CALLS_ENABLED: "false"
      WINBACK_WHATSAPP_ENABLED: "false"
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

volumes:
  # Survives `docker compose down`. Removing the database means saying so:
  # `docker compose down -v`.
  tensor-pgdata:
