name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Vet & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tensor
          POSTGRES_PASSWORD: tensor
          POSTGRES_DB: tensor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tensor -d tensor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify formatting
        run: test -z "$(gofmt -l internal cmd)"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TENSOR_TEST_DB: postgres://tensor:tensor@localhost:5432/tensor_test?sslmode=disable
        run: go test ./...
